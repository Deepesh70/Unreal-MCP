[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unreal-mcp"
version = "0.1.0"
description = "MCP server for Unreal Engine — AI-powered level editing via any MCP client"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "fastmcp",
    "websockets",
    "python-dotenv",
]

[project.optional-dependencies]
agent = [
    "langchain",
    "langchain_core",
    "langchain_mcp_adapters",
    "langchain_groq",
    "langchain_ollama",
    "langchain_google_genai",
    "httpx==0.27.2",
    "httpcore==1.0.7",
    "legacy-cgi",
]

[project.scripts]
unreal-mcp = "unreal_mcp.cli:main"

[tool.setuptools.packages.find]
include = ["unreal_mcp*"]
