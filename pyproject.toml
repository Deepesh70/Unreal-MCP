[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unreal-mcp"
version = "0.2.0"
description = "Production-grade MCP server & multi-agent generative architecture for Unreal Engine 5"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "fastmcp",
    "websockets",
    "python-dotenv",
]

[project.optional-dependencies]
agent = [
    "langchain",
    "langchain_core",
    "langchain_mcp_adapters",
    "langchain_groq",
    "langchain_ollama",
    "langchain_google_genai",
    "langchain-chroma",
    "langchain-huggingface",
    "httpx>=0.27.0",
    "httpcore>=1.0.0",
]
api = [
    "fastapi",
    "uvicorn",
    "websockets",
]
codegen = [
    "jinja2",
    "pydantic>=2.0",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]
all = [
    "unreal-mcp[agent,api,codegen,dev]",
]

[project.scripts]
unreal-mcp = "unreal_mcp.cli:main"

[tool.setuptools.packages.find]
include = ["unreal_mcp*", "agents*"]

[tool.setuptools.package-data]
"unreal_mcp" = ["templates/*.j2"]
