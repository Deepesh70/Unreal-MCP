name: CI Pipeline

on:
  push:
    branches: [main, master, deep]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'manuals/**'
      - 'recipes/**'
  pull_request:
    branches: [main, master, deep]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-checks:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "**/requirements*.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio ruff
          pip install -e .

      # --- Code Quality / Linting ---
      - name: Lint with Ruff
        run: |
          # Fails if syntax errors or undefined variables exist
          ruff check unreal_mcp/ server.py agent.py --select=E9,F63,F7,F82 --output-format=github
          # Style and convention warnings
          ruff check unreal_mcp/ server.py agent.py --exit-zero

      # --- Unit & Async Tests ---
      - name: Run Pytest Suite
        run: |
          pytest tests/ -v

      # --- MCP CLI Smoke Test ---
      - name: MCP CLI & Server Smoke Test
        run: |
          unreal-mcp --help
          python -m compileall -q unreal_mcp/ server.py agent.py tests/
          echo "Unreal-MCP packages and CLI compiled cleanly."
